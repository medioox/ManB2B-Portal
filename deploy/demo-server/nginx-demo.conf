# Man portal demo — static files only.
server {
    listen 80__DEFAULT__;
__LISTEN6__    server_name __SERVER_NAME__;
    root __ROOT__;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Versioned assets (app.js?v=…, fonts, images) can be cached long; the page itself never.
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /data.json  { add_header Cache-Control "no-cache"; }
    location ~* \.(js|css|woff2|png|jpg|svg)$ { expires 30d; add_header Cache-Control "public"; }

    # The demo routes inside the page, so any path serves the app.
    location / { try_files $uri /index.html; }
}
