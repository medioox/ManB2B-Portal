# Edge proxy: rate limiting, request queueing, upstream retries and static/media serving.
worker_processes auto;
events { worker_connections 4096; multi_accept on; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 30;
  server_tokens off;
  client_max_body_size 25m;

  log_format main '$remote_addr "$request" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time rid=$request_id';
  access_log /var/log/nginx/access.log main;

  gzip on; gzip_comp_level 5; gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # ---- traffic shaping: protect the app from bursts instead of failing under them ----
  limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Active colour (blue/green) is switched by deploy/scripts/deploy.sh by rewriting this include.
  include /etc/nginx/upstream/active.conf;

  server {
    listen 80;
    server_name _;
    limit_conn perip 60;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Request-ID $request_id always;

    location = /nginx-health { access_log off; return 200 "ok\n"; }

    location /media/ {
      alias /srv/media/;
      expires 7d;
      add_header Cache-Control "public";
    }

    location ~ ^/api/v1/auth/(otp|login) {
      limit_req zone=auth burst=5 nodelay;
      include /etc/nginx/proxy_backend.conf;
    }

    location /api/ {
      limit_req zone=api burst=60;           # queue short bursts instead of rejecting
      include /etc/nginx/proxy_backend.conf;
    }

    location /django-admin/ { include /etc/nginx/proxy_backend.conf; }
    location /django-static/ { include /etc/nginx/proxy_backend.conf; expires 30d; }

    location /_next/static/ {
      proxy_pass http://frontend;
      expires 365d;
      add_header Cache-Control "public, immutable";
    }

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
